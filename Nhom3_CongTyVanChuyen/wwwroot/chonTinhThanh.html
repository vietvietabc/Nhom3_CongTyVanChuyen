<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chọn Tỉnh/Quận Huyện/Phường Xã</title>
</head>
<body>
    <h2>Chọn địa chỉ</h2>

    <select id="tinhThanhPho">
        <option value="">--Chọn tỉnh--</option>
    </select>

    <select id="quanHuyen">
        <option value="">--Chọn quận huyện--</option>
    </select>

    <select id="phuongXa">
        <option value="">--Chọn phường xã--</option>
    </select>

    <select id="soNha">
        <option value="">--Chọn số nhà--</option>
    </select>

    <script>
        const apiBaseUrl = "https://localhost:7113/api"; // sửa lại nếu API khác

        async function loadTinhThanhPho() {
            const res = await fetch(`${apiBaseUrl}/TinhThanhPho`);
            const tinhList = await res.json();
            const selectTinh = document.getElementById('tinhThanhPho');
            selectTinh.innerHTML = `<option value="">--Chọn tỉnh--</option>`;
            tinhList.forEach(tp => {
                const option = document.createElement('option');
                option.value = tp.maTinhTP;
                option.text = tp.tenTinhTP;
                selectTinh.appendChild(option);
            });
        }

        async function loadQuanHuyen(maTinhTP) {
            const res = await fetch(`${apiBaseUrl}/QuanHuyen/${maTinhTP}`);
            const quanList = await res.json();
            const selectQuan = document.getElementById('quanHuyen');
            selectQuan.innerHTML = `<option value="">--Chọn quận huyện--</option>`;
            quanList.forEach(qh => {
                const option = document.createElement('option');
                option.value = qh.maQuanHuyen;
                option.text = qh.tenQuanHuyen;
                selectQuan.appendChild(option);
            });
        }

        async function loadPhuongXa(maQuanHuyen) {
            const res = await fetch(`${apiBaseUrl}/PhuongXa/${maQuanHuyen}`);
            const phuongList = await res.json();
            const selectPhuong = document.getElementById('phuongXa');
            selectPhuong.innerHTML = `<option value="">--Chọn phường xã--</option>`;
            phuongList.forEach(px => {
                const option = document.createElement('option');
                option.value = px.maPhuongXa;
                option.text = px.tenPhuongXa;
                selectPhuong.appendChild(option);
            });
        }


        async function loadSoNha(maPhuongXa) {
            const res = await fetch(`${apiBaseUrl}/SoNha/${maPhuongXa}`);
            const soNhaList = await res.json();
            const selectSoNha = document.getElementById('soNha');
            selectSoNha.innerHTML = `<option value="">--Chọn số nhà--</option>`;
            soNhaList.forEach(sn => {
                const option = document.createElement('option');
                option.value = sn.maSoNha;
                option.text = sn.diaChiSoNha;
                selectSoNha.appendChild(option);
            });
        }

        // Gắn sự kiện
        document.getElementById('tinhThanhPho').addEventListener('change', function() {
            const maTinhTP = this.value;
            if (maTinhTP) {
                loadQuanHuyen(maTinhTP);
            }
            document.getElementById('quanHuyen').innerHTML = `<option value="">--Chọn quận huyện--</option>`;
            document.getElementById('phuongXa').innerHTML = `<option value="">--Chọn phường xã--</option>`;
            document.getElementById('soNha').innerHTML = `<option value="">--Chọn số nhà--</option>`;
        });

        document.getElementById('quanHuyen').addEventListener('change', function() {
            const maQuanHuyen = this.value;
            if (maQuanHuyen) {
                loadPhuongXa(maQuanHuyen);
            }
            document.getElementById('phuongXa').innerHTML = `<option value="">--Chọn phường xã--</option>`;
            document.getElementById('soNha').innerHTML = `<option value="">--Chọn số nhà--</option>`;
        });

        document.getElementById('phuongXa').addEventListener('change', function() {
            const maPhuongXa = this.value;
            if (maPhuongXa) {
                loadSoNha(maPhuongXa);
            }
            document.getElementById('soNha').innerHTML = `<option value="">--Chọn số nhà--</option>`;
        });

        // Tải tỉnh lúc mở trang
        loadTinhThanhPho();
    </script>
</body>
</html>
